<style include="cr-shared-style settings-shared md-select">
  :host {
    --selected-background-color: #F8F9FA;
    --table-header-background-color: #E9E9F4;
    --tinted-color: linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, #FFFFFF 97.4%);
    --text02: #495057;
  }

  @media (prefers-color-scheme: dark) {
    :host {
      --selected-background-color: #222325;
      --table-header-background-color: #3B3E4F;
      --tinted-color: linear-gradient(180deg, rgba(41, 42, 45, 0) 0%, #292a2d 97.4%);
      --text02: #C2C4CF;
    }
  }

  mark {
    background: transparent;
    color: #E32444;
  }

  .label.shields-primary-title {
    font-size: 16px;
    font-family: Poppins,sans-serif;
    font-weight: 500;
    margin: 24px 0 8px 0;
  }

  .label.shields-primary-title-sm {
    font-size: 14px;
    font-weight: 500;
    color: var(--text02);
  }

  .label.shields-secondary-title {
    margin-bottom: 16px;
  }

  .label.shields-secondary-title.bold {
    font-weight: 500;
    margin-bottom: 0;
  }

  .filter-list-description {
    font-size: 0.9em;
    color: var(--text02);
  }

  .flex {
    align-self: center;
    flex: 1 1 auto;
  }

  .flex-container {
    display: flex;
    padding: 8px 1em;
  }

  .filter-list-box {
    height: 200px;
    overflow: hidden;
    margin-bottom: 10px;
    position: relative;
  }

  .filter-list-box.expanded-true {
    height: auto;
    overflow: unset;
  }

  .filter-list-box.expanded-false::after {
    content: '';
    background: var(--tinted-color);
    width: 100%;
    height: 80px;
    display: block;
    position: absolute;
    bottom: 0;
    pointer-events: none;
  }

  .filter-list-item {
    padding: 3px 10px;
    border-radius: 4px;
  }

  .filter-list-item.selected-true {
    background-color: var(--selected-background-color);
    font-weight: 500;
  }

  .list-actions-box {
    display: flex;
    margin-bottom: 10px;
    gap: 8px;
  }

  .update-lists-updated {
    --leo-button-color: var(--leo-color-systemfeedback-success-text);
  }

  .update-lists-failed {
    --leo-button-color: var(--leo-color-systemfeedback-error-text);
  }

  .subscribe-url-form {
    display: grid;
    grid-template-columns: 1fr 80px;
    grid-gap: 10px;
    align-items: flex-start;
  }

  .subscribe-url-item.header {
    font-weight: 500;
    background: var(--table-header-background-color);
    border-radius: 4px 4px 0 0;
    padding: 10px;
    border: 0;
  }

  .subscribe-url-item {
    display: grid;
    grid-template-columns: 26px 1fr 0.5fr 50px;
    grid-gap: 5px;
    align-items: center;
    padding: 5px 10px;
    border-bottom: 1px solid var(--table-header-background-color);
  }

  .subscribe-url-item.selected-true {
    background-color: var(--selected-background-color);
  }

  .subscribe-url-item:last-of-type {
    border-bottom: 0;
  }

  .subscribe-url-item-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    max-width: 40ch;
  }

  .subscribe-url-item-name.selected-true {
    font-weight: 500;
  }

  .subscribe-url-list-title {
    font-size: 16px;
    font-weight: 500;
  }

  .subscribe-url-list-th-name { grid-column: 2; }
  .subscribe-url-list-th-updated { grid-column: 3; }

  .subscribe-url-list {
    margin-bottom: 24px;
    overflow: hidden;
    border-radius: 4px;
    border: 1px solid var(--table-header-background-color);
    margin-top: 5px;
  }

  #search-box {
    padding: 5px;
  }

  #search-box iron-icon {
    --iron-icon-fill-color: var(--google-grey-500);
  }

  .addon-catalog-status {
    display: flex;
    align-items: center;
    gap: var(--leo-spacing-xl);
    padding: var(--leo-spacing-xl) var(--leo-spacing-2xl);
    margin-bottom: var(--leo-spacing-xl);
    border-radius: var(--leo-radius-l);
    background: var(--leo-color-container-highlight);
  }

  .addon-catalog-status-title {
    font: var(--leo-font-default-semibold);
    color: var(--leo-color-text-primary);
  }

  .addon-catalog-status-desc {
    font: var(--leo-font-default-regular);
    color: var(--leo-color-text-secondary);
    margin-top: var(--leo-spacing-s);
  }

  .addon-catalog-header {
    display: flex;
    align-items: center;
    gap: var(--leo-spacing-xl);
  }

  .addon-catalog-toggle {
    display: flex;
    align-items: center;
    gap: var(--leo-spacing-m);
    font: var(--leo-font-default-semibold);
    color: var(--leo-color-text-primary);
    cursor: pointer;
  }

  .addon-catalog-filters {
    display: flex;
    align-items: center;
    gap: var(--leo-spacing-m);
    margin-bottom: var(--leo-spacing-xl);
  }

  .addon-catalog-search {
    flex: 1 1 auto;
  }

  .addon-catalog-search-icon {
    padding: 5px;
  }

  .addon-catalog-search-icon iron-icon {
    --iron-icon-fill-color: var(--google-grey-500);
  }

  .addon-catalog-row {
    display: grid;
    grid-template-columns: 2fr 1.2fr 1.2fr 1.6fr 1fr 1fr auto;
    gap: var(--leo-spacing-m);
    align-items: center;
    padding: var(--leo-spacing-l) 0;
    border-bottom: 1px solid var(--leo-color-divider-subtle);
    font: var(--leo-font-small-regular);
    color: var(--leo-color-text-primary);
  }

  .addon-catalog-row.header {
    font: var(--leo-font-small-semibold);
    color: var(--leo-color-text-secondary);
  }

  .addon-title {
    font: var(--leo-font-default-semibold);
  }

  .addon-desc {
    color: var(--leo-color-text-secondary);
  }

  .addon-needs-dev-mode {
    font: var(--leo-font-x-small-semibold);
    color: var(--leo-color-systemfeedback-warning-text);
  }

  .addon-needs-dev-mode a {
    color: var(--leo-color-text-interactive);
    text-decoration: none;
  }

  .addon-action {
    justify-self: end;
  }

  .addon-catalog-message {
    display: flex;
    align-items: center;
    gap: var(--leo-spacing-m);
    padding: var(--leo-spacing-xl) 0;
    font: var(--leo-font-default-regular);
    color: var(--leo-color-text-secondary);
  }

  .addon-catalog-footnote {
    font: var(--leo-font-small-regular);
    color: var(--leo-color-text-secondary);
    margin: var(--leo-spacing-m) 0 var(--leo-spacing-xl);
  }

  cr-dialog [slot="title"] {
    font: var(--leo-font-heading-h3);
    color: var(--leo-color-text-primary);
  }

  .addon-catalog-dialog-body {
    font: var(--leo-font-default-regular);
    color: var(--leo-color-text-primary);
  }

  .addon-catalog-dialog-body ul {
    padding-inline-start: var(--leo-spacing-xl);
  }

  .addon-catalog-dialog-buttons {
    display: flex;
    justify-content: flex-start;
    gap: var(--leo-spacing-m);
  }

  .addon-catalog-dialog-buttons leo-button {
    width: auto;
    flex: 0 0 auto;
  }

  .my-addons-row {
    display: flex;
    flex: 1 1 auto;
    align-items: center;
    gap: var(--leo-spacing-xl);
  }

  #adblock-section .settings-box:first-child {
    border-top: transparent;
  }
</style>

<settings-subpage page-title="$i18n{adblockContentFiltersLabel}">
<div id="adblock-section">
  <div class="settings-box">
    <div class="flex">
        <div class="label shields-primary-title">$i18n{adblockTrackingFiltersLabel}</div>
        <div class="label secondary shields-secondary-title">
          $i18n{adblockTrackingFiltersDesc}
        </div>
        <cr-input
          type="text"
          placeholder="$i18n{adblockFilterListsInputPlaceHolder}"
          min="1"
          max="100"
          value="{{filterListTitle}}"
        >
          <span id="search-box" slot="inline-suffix">
            <iron-icon icon="search"></iron-icon>
          </span>
        </cr-input>
        <div class$="filter-list-box expanded-[[hasListExpanded_]]">
          <template is="dom-repeat" items="[[filterList_]]"
          filter="{{searchListBy_(filterListTitle)}}" observe="val" initial-count="10">
            <div class$="filter-list-item selected-[[item.enabled]]">
              <cr-checkbox checked="{{item.enabled}}" on-change="handleFilterListItemToggle_">
                <div>
                  <div>[[item.title]]</div>
                  <div class="filter-list-description">[[item.desc]]</div>
                </div>
              </cr-checkbox>
            </div>
          </template>
        </div>
        <div class="list-actions-box">
          <template is="dom-if" if="[[!hasListExpanded_]]">
            <div>
              <cr-button on-click="handleShowList_">$i18n{adblockShowFullListsButtonLabel}</cr-button>
            </div>
          </template>
          <div class$="update-lists-[[listsUpdatingState_]]">
            <template is="dom-if" if="[[!listsUpdatingState_]]">
              <cr-button on-click="handleUpdateLists_">
                <span>$i18n{adblockUpdateListsButtonLabel}</span>
              </cr-button>
            </template>
            <template is="dom-if" if="[[isEqual_(listsUpdatingState_, 'updating')]]">
              <cr-button on-click="handleUpdateLists_">
                <leo-progressring slot="prefix-icon"></leo-progressring>
                <span>$i18n{adblockUpdateListsUpdatingButtonLabel}</span>
              </cr-button>
            </template>
            <template is="dom-if" if="[[isEqual_(listsUpdatingState_, 'updated')]]">
              <cr-button on-click="handleUpdateLists_">
                <leo-icon name="check-circle-outline" slot="prefix-icon"></leo-icon>
                <span>$i18n{adblockUpdateListsUpdatedButtonLabel}</span>
              </cr-button>
            </template>
            <template is="dom-if" if="[[isEqual_(listsUpdatingState_, 'failed')]]">
              <cr-button on-click="handleUpdateLists_">
                <leo-icon name="warning-circle-outline" slot="prefix-icon"></leo-icon>
                <span>$i18n{adblockUpdateListsRetryButtonLabel}</span>
              </cr-button>
            </template>
          </div>
        </div>
    </div>
  </div>
  <!-- TODO: Replace add-on catalog text with localized strings. -->
  <div class="settings-box">
    <div class="flex">
      <template is="dom-if" if="[[!catalogEnabled_]]" restamp>
        <div class="label shields-primary-title">Add-on catalog</div>
        <div class="label secondary shields-secondary-title">
          Add-ons made by other users, with filters and scriptlets.<br>
          Opening the catalog contacts a server, which can see your IP address.<br>
          The catalog is off until you turn it on.
        </div>
        <div class="addon-catalog-status">
          <div class="flex">
            <div class="addon-catalog-status-title">Catalog is off.</div>
            <div class="addon-catalog-status-desc">
              Nothing has been sent to any server.
            </div>
          </div>
          <leo-button on-click="handleTurnOnCatalog_">Turn on catalog</leo-button>
        </div>
      </template>
      <template is="dom-if" if="[[catalogEnabled_]]" restamp>
        <div class="addon-catalog-header">
          <div class="flex">
            <div class="label shields-primary-title">Add-on catalog</div>
            <div class="label secondary shields-secondary-title">
              Add-ons made by other users. Open one to read its code before
              downloading.
            </div>
          </div>
          <label class="addon-catalog-toggle">
            <span>Catalog is on</span>
            <leo-toggle checked="[[catalogEnabled_]]"
                on-change="handleCatalogToggle_">
            </leo-toggle>
          </label>
        </div>
        <div class="addon-catalog-filters">
          <cr-input type="search" class="addon-catalog-search"
              placeholder="Search by title, author or category"
              value="[[catalogSearch_]]" on-input="onCatalogSearchInput_">
            <span class="addon-catalog-search-icon" slot="inline-suffix">
              <iron-icon icon="search"></iron-icon>
            </span>
          </cr-input>
          <select class="md-select" aria-label="Category"
              on-change="onCatalogCategoryChange_">
            <option value="">Category: All</option>
            <template is="dom-repeat"
                items="[[getCatalogCategories_(catalogAddons_)]]">
              <option value="[[item]]">[[item]]</option>
            </template>
          </select>
        </div>
        <template is="dom-if" if="[[isEqual_(catalogLoadState_, 'loading')]]">
          <div class="addon-catalog-message">
            <leo-progressring></leo-progressring>
            <span>Loading catalog…</span>
          </div>
        </template>
        <template is="dom-if" if="[[isEqual_(catalogLoadState_, 'failed')]]">
          <div class="addon-catalog-message">
            <span>Couldn't reach the catalog server.</span>
            <leo-button kind="outline" size="small" on-click="loadCatalog_">
              Try again
            </leo-button>
          </div>
        </template>
        <template is="dom-if" if="[[isEqual_(catalogLoadState_, 'loaded')]]">
        <div class="addon-catalog-table" role="table">
          <div class="addon-catalog-row header" role="row">
            <span role="columnheader">Title</span>
            <span role="columnheader">Author</span>
            <span role="columnheader">Category</span>
            <span role="columnheader">Contains</span>
            <span role="columnheader">Published</span>
            <span role="columnheader">Updated</span>
            <span role="columnheader"></span>
          </div>
          <template is="dom-repeat"
              items="[[filterCatalogAddons_(catalogAddons_, catalogSearch_, catalogCategory_)]]">
            <div class="addon-catalog-row" role="row">
              <div role="cell">
                <div class="addon-title">[[item.title]]</div>
                <div class="addon-desc">[[item.description]]</div>
              </div>
              <span role="cell">[[item.author]]</span>
              <span role="cell">[[item.category]]</span>
              <div role="cell">
                <div>[[getAddonContents_(item)]]</div>
                <template is="dom-if"
                    if="[[addonNeedsDeveloperMode_(item, developerModePref_.value)]]">
                  <div class="addon-needs-dev-mode">
                    Needs Developer mode ·
                    <a href="#" on-click="handleTurnOnDeveloperMode_">Turn on</a>
                  </div>
                </template>
              </div>
              <span role="cell">[[formatCatalogDate_(item.published_at)]]</span>
              <span role="cell">[[formatCatalogDate_(item.updated_at)]]</span>
              <div role="cell" class="addon-action">
                <leo-button size="small"
                    isDisabled$="[[addonNeedsDeveloperMode_(item, developerModePref_.value)]]"
                    on-click="handleDownloadAddon_">
                  Download
                </leo-button>
              </div>
            </div>
          </template>
        </div>
        <template is="dom-if" if="[[!catalogAddons_.length]]">
          <div class="addon-catalog-message">No add-ons in the catalog yet.</div>
        </template>
        </template>
        <div class="addon-catalog-footnote">
          Add-ons with scriptlets can be downloaded only when Developer mode is
          on. Rules-only add-ons do not need it.
        </div>
      </template>
    </div>
  </div>

  <template is="dom-if" if="[[showCatalogDialog_]]" restamp>
    <cr-dialog show-on-attach on-close="handleCatalogDialogCancel_">
      <div slot="title">Turn on the add-on catalog?</div>
      <div slot="body" class="addon-catalog-dialog-body">
        <p>
          Brave will connect to a catalog server to show add-ons made by other
          users.
        </p>
        <ul>
          <li>The server will see your internet address (IP address).</li>
          <li>
            Brave loads the whole catalog at once, so the server does not know
            which add-on you look at.
          </li>
          <li>
            Brave sends nothing about you: no filters, no scriptlets, no
            browsing data.
          </li>
        </ul>
        <p>
          You can turn it off at any time. This stops future contact, but
          add-ons you already downloaded stay on your device.
        </p>
      </div>
      <div slot="button-container" class="addon-catalog-dialog-buttons">
        <leo-button kind="outline" on-click="handleCatalogDialogCancel_">
          Not now
        </leo-button>
        <leo-button on-click="handleCatalogDialogConfirm_">Turn on</leo-button>
        <leo-button kind="plain" on-click="handleCatalogLearnMore_">
          Learn more
        </leo-button>
      </div>
    </cr-dialog>
  </template>
  <div class="settings-box">
    <div class="flex">
      <div class="label shields-primary-title">
        $i18n{adblockAddCustomFiltersListsLabel}
      </div>
      <div class="label secondary shields-secondary-title bold">
        $i18n{adblockAddCustomFiltersListsDesc}
      </div>
      <div class="label secondary shields-secondary-title">
        $i18n{adblockAddCustomFiltersListsNote}
      </div>
      <div class="subscribe-url-form">
        <cr-input
          type="url"
          spellcheck="false"
          placeholder="$i18n{adblockFilterListsInputURLPlaceholder}"
          min="1"
          max="500"
          value="{{subscribeUrl_}}"
          on-keyup="onKeyUp_"
        >
        </cr-input>
        <cr-button type="submit" on-click="handleSubmitUrl_">
          $i18n{adblockAddListsButtonLabel}
        </cr-button>
      </div>
      <template is="dom-if" if="[[subscriptionList_.length]]">
        <div class="label shields-primary-title-sm">
          $i18n{adblockCustomListsLabel}
        </div>
        <div class="subscribe-url-list">
          <div class="subscribe-url-item header">
            <span class="subscribe-url-list-th-name">
              $i18n{adblockFilterListsTableTitleHeader}
            </span>
            <span class="subscribe-url-list-th-updated">
              $i18n{adblockFilterListsTableUpdatedHeader}
            </span>
          </div>
          <template is="dom-repeat" items="[[subscriptionList_]]" initial-count="10">
            <div class$="subscribe-url-item
            selected-[[item.enabled]]">
              <cr-checkbox
                checked="{{item.enabled}}"
                on-change="handleSubscribeUrlItemItemToggle_"
              ></cr-checkbox>
              <span
                title="[[item.subscription_url]]" class$="subscribe-url-item-name
                selected-[[item.enabled]]"
              >
                [[item.title]]
              </span>
              <!--
                /* "Last updated" column can have four distinct states:
                * No update ever attempted: fine to show blank
                * Update attempted and failed, and never succeeded previously: show
                * "Download failure"
                * Update attempted and failed, but succeeded previously: show
                * "Download failure since + last updated time"
                * Update attempted and succeeded: show the last updated time
                */
              -->
              <span>
                <template is="dom-if" if="[[isEqual_(item.last_update_attempt, 0)]]">
                  <span>—</span>
                </template>
                <template is="dom-if" if="[[isEqual_(item.last_successful_update_attempt, 0)]]">
                  <mark>[[i18n('adblockSubscribeUrlDownloadFailed')]]</mark>
                </template>
                <template is="dom-if" if="[[isFailedUpdate_(item)]]">
                  <span>[[item.last_updated_pretty_text]] <mark>[[i18n('adblockSubscribeUrlUpdateFailed')]]</mark></span>
                </template>
                <template is="dom-if" if="[[isLastAttemptFailed_(item)]]">
                  <span>[[item.last_updated_pretty_text]]</span>
                </template>
              </span>
              <adblock-subscribe-dropdown
                on-update-subscription="handleUpdateSubscription_"
                on-view-subscription="handleViewSubscription_"
                on-delete-subscription="handleDeleteSubscription_"
              ></adblock-subscribe-dropdown>
            </div>
          </template>
        </div>
      </template>
    </div>
</div>

<settings-toggle-button
  class="cr-row"
  pref-key="brave.ad_block.developer_mode"
  label="$i18n{adblockDeveloperModeLabel}"
  sub-label="$i18n{adblockDeveloperModeDesc}">
</settings-toggle-button>

<template is="dom-if" if="[[shouldShowCustomFilters_]]" restamp>
  <div class="settings-box">
    <div class="flex">
      <div class="label shields-primary-title">
        $i18n{adblockCustomFiltersLabel}
      </div>
      <div class="label secondary shields-secondary-title" inner-h-t-m-l="[[getStringHtml_('adblockCustomFiltersDesc', 'https://support.brave.app/hc/en-us/articles/6449369961741')]]"></div>
      <adblock-filter-editor
        value="{{customFilters_}}"
        on-save="handleSave_"
      ></adblock-filter-editor>
    </div>
  </div>
</template>

<template is="dom-if" if="[[shouldShowCustomScriptlets_]]" restamp>
  <div class="settings-box">
    <div class="flex">
      <div class="label shields-primary-title">
        $i18n{adblockCustomSciptletsListLabel}
      </div>
      <adblock-scriptlet-list>
      </adblock-scriptlet-list>
    </div>
  </div>
</template>

<!-- TODO: Replace my add-ons text with localized strings. -->
<template is="dom-if" if="[[developerModePref_.value]]" restamp>
  <div class="settings-box">
    <div class="my-addons-row">
      <div class="flex">
        <div class="label shields-primary-title">My add-ons</div>
        <div class="label secondary shields-secondary-title">
          Publish your filters and scriptlets as an add-on for others to download.<br>
          Turn on the catalog to publish.
        </div>
      </div>
      <leo-button isDisabled$="[[!catalogEnabled_]]"
          on-click="handlePublishAddon_">
        Publish new add-on
      </leo-button>
    </div>
  </div>
</template>
</settings-subpage>
